name = "koremite-api"
main = "src/index.ts"
compatibility_date = "2026-05-01"

[vars]
AI_MODEL_FAST = "fast-model-placeholder"
AI_MODEL_QUALITY = "quality-model-placeholder"
MAX_INPUT_CHARS = "30000"
GEMINI_BASE_URL = "https://generativelanguage.googleapis.com"
AI_TIMEOUT_MS = "45000"
AI_MAX_RETRIES = "2"
CHUNK_CHAR_LIMIT = "6000"
CACHE_TTL_SECONDS = "86400"
RATE_LIMIT_MAX_REQUESTS = "20"
RATE_LIMIT_WINDOW_SECONDS = "3600"

[env.staging]
name = "koremite-api-staging"

[env.staging.vars]
AI_MODEL_FAST = "gemini-2.5-flash-lite"
AI_MODEL_QUALITY = "gemini-2.5-flash"
MAX_INPUT_CHARS = "30000"
GEMINI_BASE_URL = "https://generativelanguage.googleapis.com"
AI_TIMEOUT_MS = "45000"
AI_MAX_RETRIES = "2"
CHUNK_CHAR_LIMIT = "6000"
CACHE_TTL_SECONDS = "86400"
RATE_LIMIT_MAX_REQUESTS = "20"
RATE_LIMIT_WINDOW_SECONDS = "3600"
