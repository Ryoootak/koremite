<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Koremite</title>
    <style>
      :root {
        --bg: #e9e6dd;
        --screen: #efede7;
        --card: #ffffff;
        --field: #f7f5ef;
        --text: #202821;
        --muted: #62695f;
        --soft: #8b9188;
        --line: #dedbd2;
        --line-strong: #ccc7bb;
        --moss: #3b6b46;
        --moss-dark: #2f5738;
        --moss-soft: #edf4ea;
        --warn: #9b641e;
        --danger: #9f3b30;
        --shadow: 0 24px 70px rgba(42, 44, 38, 0.18);
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Yu Gothic", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 50% -10%, rgba(255, 255, 255, 0.62), transparent 36%),
          var(--bg);
        color: var(--text);
        letter-spacing: 0;
      }

      button,
      textarea,
      input,
      select {
        font: inherit;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      .stage {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .phone {
        width: min(430px, 100%);
        height: min(880px, calc(100vh - 32px));
        min-height: 680px;
        border-radius: 46px;
        padding: 12px;
        background: #191c19;
        box-shadow: var(--shadow);
      }

      .screen {
        position: relative;
        height: 100%;
        overflow: hidden;
        border-radius: 36px;
        background: var(--screen);
      }

      .notch {
        position: absolute;
        top: 10px;
        left: 50%;
        width: 104px;
        height: 29px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #191c19;
        z-index: 4;
      }

      .app {
        height: 100%;
        display: grid;
        grid-template-rows: 1fr auto;
      }

      .page {
        min-height: 0;
        overflow: auto;
        padding: 58px 18px 104px;
        scrollbar-width: none;
      }

      .page::-webkit-scrollbar {
        display: none;
      }

      .top-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 14px;
        margin-bottom: 18px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: var(--moss);
        box-shadow: 0 10px 24px rgba(59, 107, 70, 0.22);
      }

      .brand-mark svg {
        width: 24px;
        height: 24px;
      }

      h1 {
        font-size: 34px;
        line-height: 1.04;
        font-weight: 800;
      }

      .lead {
        margin-top: 7px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.45;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 30px;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.55);
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--moss);
      }

      .card {
        margin-top: 14px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 19px;
        background: rgba(255, 255, 255, 0.86);
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 11px;
      }

      .section-head h2,
      .card h3 {
        font-size: 16px;
        font-weight: 800;
      }

      .meta {
        color: var(--soft);
        font-size: 12px;
        font-weight: 650;
      }

      textarea {
        width: 100%;
        min-height: 214px;
        resize: vertical;
        border: 0;
        border-radius: 14px;
        padding: 13px;
        background: var(--field);
        color: var(--text);
        outline: none;
        line-height: 1.62;
      }

      textarea:focus,
      input:focus,
      select:focus {
        box-shadow: 0 0 0 4px rgba(59, 107, 70, 0.11);
      }

      input,
      select {
        width: 100%;
        min-height: 43px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0 12px;
        background: var(--field);
        color: var(--text);
        outline: none;
      }

      .hint-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
        margin-top: 10px;
      }

      .hint-row .meta:last-child {
        text-align: right;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field + .field {
        margin-top: 12px;
      }

      .label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 750;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        position: relative;
      }

      .chip input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .chip span {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        padding: 8px 13px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--text);
        font-size: 14px;
        font-weight: 650;
      }

      .chip input:checked + span {
        border-color: rgba(59, 107, 70, 0.36);
        background: var(--moss-soft);
        color: var(--moss-dark);
      }

      .notice {
        margin: 14px 4px 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      .primary {
        width: 100%;
        min-height: 54px;
        margin-top: 16px;
        border: 0;
        border-radius: 999px;
        background: var(--moss);
        color: #fff;
        cursor: pointer;
        font-size: 17px;
        font-weight: 800;
        box-shadow: 0 13px 28px rgba(59, 107, 70, 0.24);
      }

      .primary:disabled {
        opacity: 0.55;
        cursor: wait;
      }

      .secondary {
        min-height: 38px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.75);
        color: var(--text);
        cursor: pointer;
        font-size: 13px;
        font-weight: 750;
      }

      .segmented {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 3px;
        margin-top: 14px;
        padding: 4px;
        border-radius: 12px;
        background: #e1ded5;
      }

      .tab {
        min-height: 34px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 13px;
        font-weight: 800;
      }

      .tab[aria-selected="true"] {
        background: #fff;
        color: var(--text);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      }

      .result-title {
        font-size: 24px;
        font-weight: 800;
        line-height: 1.24;
      }

      .result-subtitle {
        margin-top: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      .stack {
        display: grid;
        gap: 12px;
        margin-top: 14px;
      }

      .block {
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.88);
      }

      .block.accent {
        background: var(--moss-soft);
        border-color: rgba(59, 107, 70, 0.25);
      }

      .block h3 {
        margin-bottom: 8px;
      }

      .block p,
      .block li {
        font-size: 15px;
        line-height: 1.68;
      }

      ul {
        margin: 0;
        padding-left: 1.2em;
      }

      li + li {
        margin-top: 5px;
      }

      .todo-item {
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }

      .todo-item:first-child {
        padding-top: 0;
        border-top: 0;
      }

      .todo-meta {
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }

      .log-entry {
        display: grid;
        grid-template-columns: 54px 1fr;
        gap: 10px;
        padding: 12px 0;
        border-top: 1px solid var(--line);
      }

      .log-entry:first-child {
        padding-top: 0;
        border-top: 0;
      }

      .speaker {
        color: var(--moss);
        font-size: 12px;
        font-weight: 850;
      }

      .empty,
      .loading {
        min-height: 420px;
        display: grid;
        place-items: center;
        text-align: center;
        color: var(--muted);
      }

      .empty-icon {
        width: 86px;
        height: 86px;
        margin: 0 auto 15px;
        border-radius: 27px;
        display: grid;
        place-items: center;
        background: var(--moss-soft);
      }

      .spinner {
        width: 34px;
        height: 34px;
        margin: 0 auto 16px;
        border: 3px solid #dfe6dc;
        border-top-color: var(--moss);
        border-radius: 999px;
        animation: spin 0.85s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .bottom-actions,
      .tabbar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 3;
        background: rgba(250, 249, 245, 0.9);
        border-top: 1px solid rgba(222, 219, 210, 0.9);
        backdrop-filter: blur(18px);
      }

      .bottom-actions {
        display: none;
        gap: 8px;
        padding: 12px 14px 26px;
      }

      .bottom-actions[data-show="true"] {
        display: flex;
      }

      .bottom-actions .secondary,
      .bottom-actions .primary-small {
        flex: 1;
      }

      .primary-small {
        min-height: 38px;
        border: 0;
        border-radius: 999px;
        background: var(--moss);
        color: #fff;
        cursor: pointer;
        font-size: 13px;
        font-weight: 800;
      }

      .tabbar {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        padding: 10px 18px 22px;
      }

      .tabbar[data-hidden="true"] {
        display: none;
      }

      .nav-button {
        min-height: 44px;
        border: 0;
        border-radius: 14px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        font-weight: 800;
      }

      .nav-button[aria-current="page"] {
        background: var(--moss-soft);
        color: var(--moss-dark);
      }

      .archive-search {
        margin-top: 14px;
      }

      .archive-item {
        width: 100%;
        margin-top: 12px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.88);
        text-align: left;
        cursor: pointer;
      }

      .archive-item h3 {
        font-size: 15px;
        font-weight: 800;
      }

      .archive-item p {
        margin-top: 6px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .delete {
        margin-top: 8px;
        color: var(--danger);
        font-size: 12px;
        font-weight: 800;
      }

      .toast {
        position: absolute;
        left: 50%;
        bottom: 88px;
        transform: translateX(-50%) translateY(14px);
        opacity: 0;
        pointer-events: none;
        border-radius: 999px;
        padding: 10px 14px;
        background: rgba(32, 40, 33, 0.92);
        color: #fff;
        font-size: 13px;
        font-weight: 750;
        transition: 180ms ease;
        z-index: 5;
      }

      .toast[data-show="true"] {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      @media (max-width: 520px) {
        .stage {
          padding: 0;
        }

        .phone {
          width: 100%;
          height: 100vh;
          min-height: 100vh;
          padding: 0;
          border-radius: 0;
          background: var(--screen);
          box-shadow: none;
        }

        .screen {
          border-radius: 0;
        }

        .notch {
          display: none;
        }

        .page {
          padding-top: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="phone" aria-label="Koremite iOS Web Mirror">
        <div class="screen">
          <div class="notch" aria-hidden="true"></div>
          <div class="app">
            <div id="page" class="page"></div>
            <div id="resultActions" class="bottom-actions" data-show="false">
              <button class="secondary" type="button" data-action="copy-minutes">議事録</button>
              <button class="secondary" type="button" data-action="share">送る</button>
              <button class="primary-small" type="button" data-action="save">保存</button>
            </div>
            <nav id="tabbar" class="tabbar">
              <button class="nav-button" type="button" data-route="input" aria-current="page">入力</button>
              <button class="nav-button" type="button" data-route="archive">保存済み</button>
            </nav>
          </div>
          <div id="toast" class="toast">コピーしました</div>
        </div>
      </div>
    </main>

    <script>
      const page = document.querySelector("#page");
      const tabbar = document.querySelector("#tabbar");
      const resultActions = document.querySelector("#resultActions");
      const toast = document.querySelector("#toast");

      const state = {
        route: "input",
        resultTab: "share",
        isGenerating: false,
        transcript:
          "今日は住宅購入について打ち合わせました。次回までに見積もりと住宅ローンの条件を確認します。金額とスケジュールは家族に共有して、来週もう一度相談します。",
        speakers: "自分, 担当者",
        category: "住宅",
        focus: new Set(["決定事項", "やること", "金額", "スケジュール"]),
        result: null,
        archives: [],
        query: ""
      };

      const maxInput = 50000;
      const categories = ["住宅", "仕事", "家庭", "その他"];
      const focusPoints = ["決定事項", "やること", "金額", "スケジュール", "懸念点", "感情"];

      function escapeHTML(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function costHint(length) {
        if (length < 1200) return "短めの文字起こしです。まとめて整理します。";
        if (length < 8000) return "内容量に合わせて、共有版と議事録をまとめて作成します。";
        return "長文のため、低コスト処理で段階的に整理します。";
      }

      function list(items) {
        if (!items?.length) return '<p class="meta">該当なし</p>';
        return `<ul>${items.map((item) => `<li>${escapeHTML(item)}</li>`).join("")}</ul>`;
      }

      function todos(items) {
        if (!items?.length) return '<p class="meta">該当なし</p>';
        return items
          .map((item) => {
            const meta = [item.owner, item.due].filter(Boolean).join(" ・ ");
            return `<div class="todo-item"><p>${escapeHTML(item.task)}</p>${meta ? `<div class="todo-meta">${escapeHTML(meta)}</div>` : ""}</div>`;
          })
          .join("");
      }

      function minutesText(result) {
        const minutes = result.detailedMinutes;
        return [
          result.title,
          "",
          "概要",
          minutes.overview,
          "",
          "論点",
          ...(minutes.topics || []).map((item) => `- ${item}`),
          "",
          "決定事項",
          ...(minutes.decisions || []).map((item) => `- ${item}`),
          "",
          "未決事項",
          ...(minutes.openIssues || []).map((item) => `- ${item}`),
          "",
          "TODO",
          ...(minutes.todos || []).map((item) => `- ${item.owner ? `${item.owner}: ` : ""}${item.task}${item.due ? `（${item.due}）` : ""}`)
        ].join("\n");
      }

      function showToast(message) {
        toast.textContent = message;
        toast.dataset.show = "true";
        setTimeout(() => {
          toast.dataset.show = "false";
        }, 1400);
      }

      function copyText(text, message = "コピーしました") {
        navigator.clipboard?.writeText(text).then(
          () => showToast(message),
          () => showToast("コピーできませんでした")
        );
      }

      function renderShellState() {
        const isResult = state.route === "result";
        resultActions.dataset.show = String(isResult && Boolean(state.result));
        tabbar.dataset.hidden = String(isResult || state.isGenerating);
        document.querySelectorAll(".nav-button").forEach((button) => {
          button.setAttribute("aria-current", button.dataset.route === state.route ? "page" : "false");
        });
      }

      function renderInput() {
        page.innerHTML = `
          <div class="top-row">
            <div>
              <h1>Koremite</h1>
              <p class="lead">文字起こしを貼り付けて、送れる議事録に整えます。</p>
            </div>
            <div class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 48 48" fill="none">
                <path d="M9 25.5 38.5 12 27 39l-5.2-11.4L9 25.5Z" fill="#fbfaf6" />
                <path d="M21.8 27.6 38.5 12" stroke="#dfe8db" stroke-width="2.4" stroke-linecap="round" />
              </svg>
            </div>
          </div>

          <form id="form">
            <section class="card">
              <div class="section-head">
                <h2>文字起こし</h2>
                <span id="countText" class="meta">${state.transcript.length.toLocaleString()} / ${maxInput.toLocaleString()}文字</span>
              </div>
              <textarea id="transcript" name="transcript" placeholder="ボイスメモの文字起こしをここに貼り付け">${escapeHTML(state.transcript)}</textarea>
              <div class="hint-row">
                <span id="limitText" class="meta">${state.transcript.length > maxInput ? "入力上限を超えています" : "音声ファイルは扱いません"}</span>
                <span id="costHintText" class="meta">${escapeHTML(costHint(state.transcript.length))}</span>
              </div>
            </section>

            <section class="card">
              <div class="field">
                <label class="label" for="speakers">話者候補</label>
                <input id="speakers" name="speakers" value="${escapeHTML(state.speakers)}" placeholder="自分, 相手" />
                <p class="meta">カンマ区切りで入力できます。話者が不明な場合は仮ラベルで整理します。</p>
              </div>
            </section>

            <section class="card">
              <div class="section-head"><h2>用途</h2></div>
              <div class="chips">
                ${categories
                  .map(
                    (category) =>
                      `<label class="chip"><input type="radio" name="category" value="${category}" ${state.category === category ? "checked" : ""} /><span>${category}</span></label>`
                  )
                  .join("")}
              </div>
            </section>

            <section class="card">
              <div class="section-head"><h2>重視ポイント</h2></div>
              <div class="chips">
                ${focusPoints
                  .map(
                    (point) =>
                      `<label class="chip"><input type="checkbox" name="focus" value="${point}" ${state.focus.has(point) ? "checked" : ""} /><span>${point}</span></label>`
                  )
                  .join("")}
              </div>
            </section>

            <p class="notice">生成時、貼り付けた文字起こしテキストはAI処理のためKoremiteのサーバーへ送信されます。音声の収録やアップロードは行いません。</p>
            <button id="submit" class="primary" type="submit" ${!state.transcript.trim() || state.transcript.length > maxInput ? "disabled" : ""}>議事録を生成</button>
          </form>
        `;
      }

      function renderLoading() {
        page.innerHTML = `
          <div class="loading">
            <div>
              <div class="spinner"></div>
              <h2>文字起こしを整理しています</h2>
              <p class="lead">共有版としっかり議事録を作成中</p>
            </div>
          </div>
        `;
      }

      function renderResult() {
        const result = state.result;
        if (!result) {
          state.route = "input";
          render();
          return;
        }

        const cost = result.costInfo || {};
        page.innerHTML = `
          <button class="secondary" type="button" data-action="back">入力へ戻る</button>
          <div style="margin-top:14px">
            <h2 class="result-title">${escapeHTML(result.title || "生成結果")}</h2>
            <p class="result-subtitle">${escapeHTML(result.category || "その他")} ・ ${cost.inputLength ?? "-"}文字 ・ ${escapeHTML(cost.processingMode || "-")}${cost.cacheHit ? " ・ cache hit" : ""}</p>
          </div>
          <div class="segmented" role="tablist" aria-label="生成結果">
            <button class="tab" type="button" role="tab" data-result-tab="share" aria-selected="${state.resultTab === "share"}">共有版</button>
            <button class="tab" type="button" role="tab" data-result-tab="minutes" aria-selected="${state.resultTab === "minutes"}">議事録</button>
            <button class="tab" type="button" role="tab" data-result-tab="log" aria-selected="${state.resultTab === "log"}">全量ログ</button>
          </div>
          <div class="stack">${renderResultTab(result)}</div>
        `;
      }

      function renderResultTab(result) {
        if (state.resultTab === "share") {
          const share = result.shareSummary;
          return `
            <section class="block accent"><h3>短く送れる文面</h3><p>${escapeHTML(share.text)}</p></section>
            <section class="block"><h3>決定事項</h3>${list(share.decisions)}</section>
            <section class="block"><h3>TODO</h3>${todos(share.todos)}</section>
            <section class="block"><h3>確認事項</h3>${list(share.confirmationPoints)}</section>
          `;
        }

        if (state.resultTab === "minutes") {
          const minutes = result.detailedMinutes;
          return `
            <section class="block"><h3>概要</h3><p>${escapeHTML(minutes.overview)}</p></section>
            <section class="block"><h3>論点</h3>${list(minutes.topics)}</section>
            <section class="block"><h3>決定事項</h3>${list(minutes.decisions)}</section>
            <section class="block"><h3>未決事項</h3>${list(minutes.openIssues)}</section>
            <section class="block"><h3>TODO</h3>${todos(minutes.todos)}</section>
            <section class="block"><h3>重要な発言</h3>${list(minutes.importantRemarks)}</section>
            <section class="block"><h3>次回に向けたメモ</h3>${list(minutes.nextMeetingNotes)}</section>
          `;
        }

        const entries = result.fullLog || [];
        return `
          <section class="block">
            <h3>全量ログ</h3>
            ${
              entries.length
                ? entries
                    .map(
                      (entry) => `
                        <div class="log-entry">
                          <div class="speaker">${escapeHTML(entry.speaker)}</div>
                          <p>${escapeHTML(entry.text)}</p>
                        </div>`
                    )
                    .join("")
                : '<p class="meta">ログなし</p>'
            }
          </section>
          ${result.confidenceWarnings?.length ? `<section class="block"><h3>確認が必要な点</h3>${list(result.confidenceWarnings)}</section>` : ""}
        `;
      }

      function renderArchive() {
        const filtered = state.archives.filter((item) => {
          const text = `${item.title} ${item.shareSummary?.text || ""} ${item.category || ""}`.toLowerCase();
          return text.includes(state.query.toLowerCase());
        });

        page.innerHTML = `
          <div class="top-row">
            <div>
              <h1 style="font-size:30px">保存済み議事録</h1>
              <p class="lead">生成結果をあとから確認できます。</p>
            </div>
            <span class="pill"><span class="dot"></span>${state.archives.length}件</span>
          </div>
          <input id="archiveSearch" class="archive-search" value="${escapeHTML(state.query)}" placeholder="タイトルや概要を検索" />
          ${
            filtered.length
              ? filtered
                  .map(
                    (item, index) => `
                      <button class="archive-item" type="button" data-archive-index="${index}">
                        <h3>${escapeHTML(item.title)}</h3>
                        <p>${escapeHTML(item.shareSummary?.text || "")}</p>
                        <p class="meta">${escapeHTML(item.category || "その他")}</p>
                        <div class="delete" data-delete-index="${index}">削除</div>
                      </button>`
                  )
                  .join("")
              : `<div class="empty"><div><div class="empty-icon">□</div><p>保存済み議事録はありません</p><p class="meta" style="margin-top:6px">生成結果画面から保存できます。</p></div></div>`
          }
        `;
      }

      function render() {
        renderShellState();
        if (state.isGenerating) renderLoading();
        else if (state.route === "input") renderInput();
        else if (state.route === "result") renderResult();
        else renderArchive();
        renderShellState();
      }

      function syncForm() {
        const transcript = document.querySelector("#transcript");
        const speakers = document.querySelector("#speakers");
        if (transcript) state.transcript = transcript.value;
        if (speakers) state.speakers = speakers.value;
        const category = document.querySelector('input[name="category"]:checked');
        if (category) state.category = category.value;
        state.focus = new Set(Array.from(document.querySelectorAll('input[name="focus"]:checked')).map((item) => item.value));
      }

      function refreshInputMeta() {
        const length = state.transcript.length;
        const countText = document.querySelector("#countText");
        const limitText = document.querySelector("#limitText");
        const costHintText = document.querySelector("#costHintText");
        const submit = document.querySelector("#submit");
        if (countText) countText.textContent = `${length.toLocaleString()} / ${maxInput.toLocaleString()}文字`;
        if (limitText) limitText.textContent = length > maxInput ? "入力上限を超えています" : "音声ファイルは扱いません";
        if (costHintText) costHintText.textContent = costHint(length);
        if (submit) submit.disabled = !state.transcript.trim() || length > maxInput;
      }

      async function generate() {
        syncForm();
        state.isGenerating = true;
        state.route = "input";
        render();

        const payload = {
          transcript: state.transcript,
          category: state.category,
          speakers: state.speakers.split(",").map((speaker) => speaker.trim()).filter(Boolean),
          focusPoints: Array.from(state.focus)
        };

        try {
          const response = await fetch("/api/minutes-test", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const json = await response.json();
          if (!response.ok) throw new Error(json.message || "生成できませんでした。");
          state.result = json;
          state.resultTab = "share";
          state.route = "result";
        } catch (error) {
          showToast(error.message || "生成できませんでした");
          state.route = "input";
        } finally {
          state.isGenerating = false;
          render();
        }
      }

      page.addEventListener("input", (event) => {
        if (event.target.matches("#transcript")) {
          state.transcript = event.target.value;
          refreshInputMeta();
          return;
        }

        if (event.target.matches("#speakers")) {
          state.speakers = event.target.value;
          return;
        }

        if (event.target.matches("#archiveSearch")) {
          state.query = event.target.value;
          render();
        }
      });

      page.addEventListener("change", (event) => {
        if (event.target.matches('input[name="category"], input[name="focus"]')) {
          syncForm();
          render();
        }
      });

      page.addEventListener("submit", (event) => {
        event.preventDefault();
        generate();
      });

      page.addEventListener("click", (event) => {
        const resultTab = event.target.closest("[data-result-tab]");
        if (resultTab) {
          state.resultTab = resultTab.dataset.resultTab;
          render();
          return;
        }

        const back = event.target.closest('[data-action="back"]');
        if (back) {
          state.route = "input";
          render();
          return;
        }

        const deleteTarget = event.target.closest("[data-delete-index]");
        if (deleteTarget) {
          event.stopPropagation();
          state.archives.splice(Number(deleteTarget.dataset.deleteIndex), 1);
          render();
          return;
        }

        const archiveTarget = event.target.closest("[data-archive-index]");
        if (archiveTarget) {
          state.result = state.archives[Number(archiveTarget.dataset.archiveIndex)];
          state.resultTab = "share";
          state.route = "result";
          render();
        }
      });

      tabbar.addEventListener("click", (event) => {
        const target = event.target.closest("[data-route]");
        if (!target) return;
        syncForm();
        state.route = target.dataset.route;
        render();
      });

      resultActions.addEventListener("click", async (event) => {
        const action = event.target.closest("[data-action]")?.dataset.action;
        if (!action || !state.result) return;
        if (action === "copy-minutes") copyText(minutesText(state.result));
        if (action === "share") {
          const text = state.result.shareSummary.text;
          if (navigator.share) {
            try {
              await navigator.share({ text });
            } catch (_) {
              copyText(text, "共有版をコピーしました");
            }
          } else {
            copyText(text, "共有版をコピーしました");
          }
        }
        if (action === "save") {
          state.archives.unshift(state.result);
          showToast("保存しました");
        }
      });

      render();
    </script>
  </body>
</html>
