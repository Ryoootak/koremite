<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Koremite</title>
    <style>
      :root {
        --bg: #e7e5df;
        --surface: #fbfaf6;
        --card: #ffffff;
        --card-2: #f6f5ef;
        --text: #202821;
        --muted: #697165;
        --soft: #8a9187;
        --line: #dbd8cf;
        --line-2: #cbc7bb;
        --moss: #3b6b46;
        --moss-dark: #2f5738;
        --moss-soft: #edf4ea;
        --warn: #9b641e;
        --shadow: 0 20px 60px rgba(47, 50, 43, 0.12);
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Yu Gothic", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.36), rgba(255, 255, 255, 0) 260px),
          var(--bg);
        color: var(--text);
        letter-spacing: 0;
      }

      button,
      textarea,
      input,
      select {
        font: inherit;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }

      .shell {
        width: min(1180px, 100%);
        margin: 0 auto;
        padding: 22px 16px 44px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 0;
      }

      .mark {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        background: var(--moss);
        box-shadow: 0 12px 24px rgba(59, 107, 70, 0.18);
        flex: 0 0 auto;
      }

      .mark svg {
        width: 23px;
        height: 23px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 28px;
        line-height: 1.05;
        font-weight: 800;
      }

      .subtitle {
        margin-top: 4px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 30px;
        padding: 7px 11px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.58);
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--moss);
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(340px, 0.88fr) minmax(0, 1.12fr);
        gap: 18px;
        align-items: start;
      }

      .panel {
        background: rgba(255, 255, 255, 0.74);
        border: 1px solid rgba(219, 216, 207, 0.9);
        border-radius: 24px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .panel-inner {
        padding: 18px;
      }

      .section {
        padding: 16px 0;
        border-top: 1px solid var(--line);
      }

      .section:first-child {
        padding-top: 0;
        border-top: 0;
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      .section-title h2,
      .section-title h3 {
        font-size: 15px;
        font-weight: 800;
      }

      .meta {
        color: var(--soft);
        font-size: 12px;
        font-weight: 650;
      }

      textarea {
        width: 100%;
        min-height: 255px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 17px;
        padding: 14px;
        background: var(--surface);
        color: var(--text);
        line-height: 1.65;
        outline: none;
      }

      textarea:focus,
      input:focus,
      select:focus {
        border-color: rgba(59, 107, 70, 0.58);
        box-shadow: 0 0 0 4px rgba(59, 107, 70, 0.1);
      }

      input,
      select {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 0 12px;
        background: var(--surface);
        color: var(--text);
        outline: none;
      }

      .field-grid {
        display: grid;
        grid-template-columns: 0.88fr 1.12fr;
        gap: 10px;
      }

      label.field-label {
        display: block;
        margin-bottom: 7px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 750;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        position: relative;
      }

      .chip input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .chip span {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        padding: 8px 13px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--text);
        font-size: 14px;
        font-weight: 700;
      }

      .chip input:checked + span {
        border-color: rgba(59, 107, 70, 0.28);
        background: var(--moss-soft);
        color: var(--moss-dark);
      }

      .notice {
        display: flex;
        gap: 10px;
        padding: 12px;
        border-radius: 16px;
        background: var(--card-2);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }

      .notice-icon {
        width: 22px;
        height: 22px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        background: var(--moss-soft);
        color: var(--moss);
        font-weight: 900;
      }

      .primary {
        width: 100%;
        min-height: 52px;
        border: 0;
        border-radius: 999px;
        background: var(--moss);
        color: #fff;
        cursor: pointer;
        font-size: 16px;
        font-weight: 850;
        box-shadow: 0 14px 30px rgba(59, 107, 70, 0.24);
      }

      .primary:disabled {
        opacity: 0.55;
        cursor: wait;
      }

      .secondary {
        min-height: 38px;
        padding: 0 13px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        color: var(--text);
        cursor: pointer;
        font-size: 13px;
        font-weight: 750;
      }

      .result-head {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 14px;
        align-items: center;
        padding: 18px;
        border-bottom: 1px solid var(--line);
        background: rgba(251, 250, 246, 0.74);
      }

      .result-title {
        font-size: 19px;
        font-weight: 850;
        line-height: 1.35;
      }

      .result-subtitle {
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 3px;
        padding: 4px;
        border-radius: 13px;
        background: #eeece5;
      }

      .tab {
        min-width: 76px;
        min-height: 34px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 13px;
        font-weight: 800;
      }

      .tab[aria-selected="true"] {
        background: #fff;
        color: var(--text);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
      }

      .result-body {
        padding: 18px;
        min-height: 520px;
      }

      .empty {
        min-height: 420px;
        display: grid;
        place-items: center;
        text-align: center;
        color: var(--muted);
      }

      .empty-visual {
        width: 92px;
        height: 92px;
        margin: 0 auto 16px;
        border-radius: 28px;
        background: var(--moss-soft);
        display: grid;
        place-items: center;
      }

      .empty-visual svg {
        width: 48px;
        height: 48px;
      }

      .loading {
        min-height: 420px;
        display: grid;
        place-items: center;
        text-align: center;
      }

      .spinner {
        width: 34px;
        height: 34px;
        margin: 0 auto 16px;
        border: 3px solid #dfe6dc;
        border-top-color: var(--moss);
        border-radius: 999px;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .content-stack {
        display: grid;
        gap: 12px;
      }

      .block {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--card);
        padding: 15px;
      }

      .block.accent {
        background: var(--moss-soft);
        border-color: rgba(59, 107, 70, 0.23);
      }

      .block h3 {
        margin-bottom: 9px;
        font-size: 14px;
        font-weight: 850;
      }

      .block p,
      .block li {
        color: var(--text);
        font-size: 15px;
        line-height: 1.7;
      }

      ul {
        margin: 0;
        padding-left: 1.25em;
      }

      li + li {
        margin-top: 5px;
      }

      .todo {
        display: grid;
        gap: 7px;
      }

      .todo-item {
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }

      .todo-item:first-child {
        padding-top: 0;
        border-top: 0;
      }

      .todo-meta {
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }

      .log-entry {
        display: grid;
        grid-template-columns: 58px 1fr;
        gap: 10px;
        padding: 12px 0;
        border-top: 1px solid var(--line);
      }

      .log-entry:first-child {
        padding-top: 0;
        border-top: 0;
      }

      .speaker {
        color: var(--moss);
        font-size: 12px;
        font-weight: 850;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%) translateY(18px);
        opacity: 0;
        pointer-events: none;
        border-radius: 999px;
        padding: 11px 15px;
        background: rgba(32, 40, 33, 0.92);
        color: #fff;
        font-size: 13px;
        font-weight: 750;
        transition: 180ms ease;
      }

      .toast[data-show="true"] {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      @media (max-width: 920px) {
        .workspace {
          grid-template-columns: 1fr;
        }

        .result-body {
          min-height: 360px;
        }
      }

      @media (max-width: 620px) {
        .shell {
          padding: 16px 10px 32px;
        }

        .topbar {
          align-items: flex-start;
        }

        h1 {
          font-size: 25px;
        }

        .badge {
          display: none;
        }

        .panel {
          border-radius: 21px;
        }

        .field-grid {
          grid-template-columns: 1fr;
        }

        .result-head {
          grid-template-columns: 1fr;
        }

        .tabs {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M9 25.5 38.5 12 27 39l-5.2-11.4L9 25.5Z" fill="#fbfaf6" />
              <path d="M21.8 27.6 38.5 12" stroke="#dfe8db" stroke-width="2.4" stroke-linecap="round" />
            </svg>
          </div>
          <div>
            <h1>Koremite</h1>
            <p class="subtitle">文字起こしを貼り付けて、送れる議事録に整える</p>
          </div>
        </div>
        <div class="badge"><span class="status-dot"></span>Vercel Preview</div>
      </header>

      <div class="workspace">
        <form id="form" class="panel">
          <div class="panel-inner">
            <section class="section">
              <div class="section-title">
                <h2>文字起こし</h2>
                <span class="meta" id="count">0文字</span>
              </div>
              <textarea id="transcript" name="transcript" placeholder="ボイスメモの文字起こしをここに貼り付け">今日は住宅購入について打ち合わせました。次回までに見積もりと住宅ローンの条件を確認します。金額とスケジュールは家族に共有して、来週もう一度相談します。</textarea>
            </section>

            <section class="section">
              <div class="field-grid">
                <div>
                  <label class="field-label" for="category">用途</label>
                  <select id="category" name="category">
                    <option>住宅</option>
                    <option>仕事</option>
                    <option>家庭</option>
                    <option>その他</option>
                  </select>
                </div>
                <div>
                  <label class="field-label" for="speakers">話者候補</label>
                  <input id="speakers" name="speakers" value="自分, 担当者" />
                </div>
              </div>
            </section>

            <section class="section">
              <div class="section-title">
                <h2>重視ポイント</h2>
              </div>
              <div class="chips">
                <label class="chip"><input type="checkbox" name="focus" value="決定事項" checked /><span>決定事項</span></label>
                <label class="chip"><input type="checkbox" name="focus" value="やること" checked /><span>やること</span></label>
                <label class="chip"><input type="checkbox" name="focus" value="金額" checked /><span>金額</span></label>
                <label class="chip"><input type="checkbox" name="focus" value="スケジュール" checked /><span>スケジュール</span></label>
                <label class="chip"><input type="checkbox" name="focus" value="懸念点" /><span>懸念点</span></label>
                <label class="chip"><input type="checkbox" name="focus" value="感情" /><span>感情</span></label>
              </div>
            </section>

            <section class="section">
              <div class="notice">
                <div class="notice-icon">i</div>
                <p>生成時、貼り付けた文字起こしテキストはKoremiteのstaging APIへ送信されます。音声の収録やアップロードは行いません。</p>
              </div>
            </section>

            <button id="submit" class="primary" type="submit">議事録を生成</button>
          </div>
        </form>

        <section class="panel">
          <div class="result-head">
            <div>
              <h2 id="resultTitle" class="result-title">生成結果</h2>
              <p id="resultMeta" class="result-subtitle">共有版、議事録、全量ログをここで確認できます。</p>
            </div>
            <div class="tabs" role="tablist" aria-label="生成結果">
              <button class="tab" type="button" role="tab" data-tab="share" aria-selected="true">共有版</button>
              <button class="tab" type="button" role="tab" data-tab="minutes" aria-selected="false">議事録</button>
              <button class="tab" type="button" role="tab" data-tab="log" aria-selected="false">全量ログ</button>
            </div>
          </div>
          <div id="resultBody" class="result-body"></div>
        </section>
      </div>
    </main>

    <div id="toast" class="toast">コピーしました</div>

    <script>
      const form = document.querySelector("#form");
      const submit = document.querySelector("#submit");
      const transcript = document.querySelector("#transcript");
      const count = document.querySelector("#count");
      const resultTitle = document.querySelector("#resultTitle");
      const resultMeta = document.querySelector("#resultMeta");
      const resultBody = document.querySelector("#resultBody");
      const tabs = Array.from(document.querySelectorAll(".tab"));
      const toast = document.querySelector("#toast");

      let currentResult = null;
      let currentTab = "share";

      function updateCount() {
        const length = transcript.value.length;
        const mode = length >= 8000 ? "長文のため、段階的に整理します" : "staging APIで生成します";
        count.textContent = `${length.toLocaleString()}文字 ・ ${mode}`;
      }

      function escapeHTML(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function list(items) {
        if (!items?.length) return "<p class=\"meta\">該当なし</p>";
        return `<ul>${items.map((item) => `<li>${escapeHTML(item)}</li>`).join("")}</ul>`;
      }

      function todos(items) {
        if (!items?.length) return "<p class=\"meta\">該当なし</p>";
        return `<div class="todo">${items.map((item) => {
          const meta = [item.owner, item.due].filter(Boolean).join(" ・ ");
          return `<div class="todo-item"><p>${escapeHTML(item.task)}</p>${meta ? `<div class="todo-meta">${escapeHTML(meta)}</div>` : ""}</div>`;
        }).join("")}</div>`;
      }

      function copyText(text) {
        navigator.clipboard?.writeText(text).then(() => {
          toast.dataset.show = "true";
          setTimeout(() => {
            toast.dataset.show = "false";
          }, 1400);
        });
      }

      function minutesText(result) {
        const minutes = result.detailedMinutes;
        const lines = [
          result.title,
          "",
          "概要",
          minutes.overview,
          "",
          "論点",
          ...(minutes.topics || []).map((item) => `- ${item}`),
          "",
          "決定事項",
          ...(minutes.decisions || []).map((item) => `- ${item}`),
          "",
          "未決事項",
          ...(minutes.openIssues || []).map((item) => `- ${item}`),
          "",
          "TODO",
          ...(minutes.todos || []).map((item) => `- ${item.owner ? `${item.owner}: ` : ""}${item.task}${item.due ? `（${item.due}）` : ""}`)
        ];
        return lines.join("\n");
      }

      function renderEmpty() {
        resultBody.innerHTML = `
          <div class="empty">
            <div>
              <div class="empty-visual" aria-hidden="true">
                <svg viewBox="0 0 80 80" fill="none">
                  <path d="M21 17h30l8 8v38H21V17Z" fill="#fff" stroke="#aac7a8" stroke-width="3" />
                  <path d="M50 18v10h10" stroke="#aac7a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M30 38h20M30 48h16" stroke="#3b6b46" stroke-width="3" stroke-linecap="round" />
                </svg>
              </div>
              <p>文字起こしを貼り付けて生成すると、ここに結果が表示されます。</p>
            </div>
          </div>`;
      }

      function renderLoading() {
        resultBody.innerHTML = `
          <div class="loading">
            <div>
              <div class="spinner"></div>
              <h3>文字起こしを整理しています</h3>
              <p class="subtitle">共有版としっかり議事録を作成中</p>
            </div>
          </div>`;
      }

      function renderResult() {
        if (!currentResult) {
          renderEmpty();
          return;
        }

        resultTitle.textContent = currentResult.title || "生成結果";
        const cost = currentResult.costInfo;
        resultMeta.textContent = `${currentResult.category || "その他"} ・ ${cost?.inputLength ?? "-"}文字 ・ ${cost?.processingMode ?? "-"}${cost?.cacheHit ? " ・ cache hit" : ""}`;

        if (currentTab === "share") {
          const share = currentResult.shareSummary;
          resultBody.innerHTML = `
            <div class="content-stack">
              <div class="actions">
                <button class="secondary" type="button" data-copy="share">共有版をコピー</button>
              </div>
              <div class="block accent"><h3>短く送れる文面</h3><p>${escapeHTML(share.text)}</p></div>
              <div class="block"><h3>決定事項</h3>${list(share.decisions)}</div>
              <div class="block"><h3>次アクション</h3>${todos(share.todos)}</div>
              <div class="block"><h3>確認事項</h3>${list(share.confirmationPoints)}</div>
            </div>`;
        }

        if (currentTab === "minutes") {
          const minutes = currentResult.detailedMinutes;
          resultBody.innerHTML = `
            <div class="content-stack">
              <div class="actions">
                <button class="secondary" type="button" data-copy="minutes">議事録をコピー</button>
              </div>
              <div class="block"><h3>概要</h3><p>${escapeHTML(minutes.overview)}</p></div>
              <div class="block"><h3>論点</h3>${list(minutes.topics)}</div>
              <div class="block"><h3>決定事項</h3>${list(minutes.decisions)}</div>
              <div class="block"><h3>未決事項</h3>${list(minutes.openIssues)}</div>
              <div class="block"><h3>TODO</h3>${todos(minutes.todos)}</div>
              <div class="block"><h3>重要な発言</h3>${list(minutes.importantRemarks)}</div>
              <div class="block"><h3>次回に向けたメモ</h3>${list(minutes.nextMeetingNotes)}</div>
            </div>`;
        }

        if (currentTab === "log") {
          const entries = currentResult.fullLog || [];
          resultBody.innerHTML = `
            <div class="content-stack">
              <div class="block">
                <h3>全量ログ</h3>
                ${entries.length ? entries.map((entry) => `
                  <div class="log-entry">
                    <div class="speaker">${escapeHTML(entry.speaker)}</div>
                    <p>${escapeHTML(entry.text)}</p>
                  </div>`).join("") : "<p class=\"meta\">ログなし</p>"}
              </div>
              ${currentResult.confidenceWarnings?.length ? `<div class="block"><h3>確認が必要な点</h3>${list(currentResult.confidenceWarnings)}</div>` : ""}
            </div>`;
        }
      }

      transcript.addEventListener("input", updateCount);
      updateCount();
      renderEmpty();

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          currentTab = tab.dataset.tab;
          tabs.forEach((item) => item.setAttribute("aria-selected", String(item === tab)));
          renderResult();
        });
      });

      resultBody.addEventListener("click", (event) => {
        const target = event.target.closest("[data-copy]");
        if (!target || !currentResult) return;
        if (target.dataset.copy === "share") copyText(currentResult.shareSummary.text);
        if (target.dataset.copy === "minutes") copyText(minutesText(currentResult));
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submit.disabled = true;
        submit.textContent = "生成中...";
        currentResult = null;
        resultTitle.textContent = "生成中";
        resultMeta.textContent = "Koremite staging APIに接続しています。";
        renderLoading();

        const formData = new FormData(form);
        const payload = {
          transcript: formData.get("transcript"),
          category: formData.get("category"),
          speakers: String(formData.get("speakers") || "")
            .split(",")
            .map((speaker) => speaker.trim())
            .filter(Boolean),
          focusPoints: formData.getAll("focus")
        };

        try {
          const response = await fetch("/api/minutes-test", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const json = await response.json();
          if (!response.ok) throw new Error(json.message || "生成できませんでした。");

          currentResult = json;
          currentTab = "share";
          tabs.forEach((item) => item.setAttribute("aria-selected", String(item.dataset.tab === "share")));
          renderResult();
        } catch (error) {
          resultTitle.textContent = "生成できませんでした";
          resultMeta.textContent = "入力内容を確認してもう一度お試しください。";
          resultBody.innerHTML = `<div class="block"><h3>エラー</h3><p>${escapeHTML(error.message || "エラーが発生しました。")}</p></div>`;
        } finally {
          submit.disabled = false;
          submit.textContent = "議事録を生成";
        }
      });
    </script>
  </body>
</html>
