<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Koremite</title>
    <style>
      :root {
        --km-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
          "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", system-ui, sans-serif;
        --km-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --km-bg: oklch(98.4% 0.004 110);
        --km-bg-2: oklch(96.4% 0.005 110);
        --km-card: #fff;
        --km-card-2: oklch(98% 0.004 110);
        --km-stroke: oklch(91% 0.005 110);
        --km-stroke-2: oklch(87% 0.006 110);
        --km-text: oklch(22% 0.01 130);
        --km-text-2: oklch(45% 0.01 130);
        --km-text-3: oklch(60% 0.01 130);
        --km-text-4: oklch(72% 0.008 130);
        --km-moss: oklch(42% 0.06 145);
        --km-moss-press: oklch(36% 0.06 145);
        --km-moss-bg: oklch(95% 0.025 145);
        --km-moss-line: oklch(85% 0.04 145);
        --km-warn: oklch(58% 0.13 55);
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e7e5df;
        font-family: var(--km-font);
        color: var(--km-text);
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.01em;
      }

      button, textarea, input { font: inherit; }
      button { -webkit-tap-highlight-color: transparent; }

      .device {
        width: min(402px, 100vw);
        height: min(874px, 100vh);
        border-radius: 48px;
        overflow: hidden;
        position: relative;
        background: var(--km-bg);
        box-shadow: 0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12);
      }

      .island {
        position: absolute;
        top: 11px;
        left: 50%;
        width: 126px;
        height: 37px;
        transform: translateX(-50%);
        border-radius: 24px;
        background: #000;
        z-index: 80;
      }

      .status {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        display: flex;
        justify-content: space-between;
        padding: 21px 27px 0 38px;
        font-size: 17px;
        font-weight: 590;
        pointer-events: none;
      }

      .status-icons {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .home-indicator {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 80;
        height: 34px;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        padding-bottom: 8px;
        pointer-events: none;
      }

      .home-indicator div {
        width: 139px;
        height: 5px;
        border-radius: 999px;
        background: rgba(0,0,0,0.25);
      }

      .screen {
        height: 100%;
        position: relative;
        overflow: hidden;
        background: var(--km-bg);
      }

      .km-scroll {
        overflow-y: auto;
        scrollbar-width: none;
      }

      .km-scroll::-webkit-scrollbar { display: none; }

      .km-btn {
        border: 0;
        cursor: pointer;
        font-weight: 600;
        letter-spacing: -0.01em;
        transition: transform 120ms ease, background 160ms ease, opacity 160ms ease;
      }

      .km-btn:active { transform: scale(0.98); }
      .km-btn[disabled] { opacity: 0.4; cursor: not-allowed; }

      .km-btn-primary {
        background: var(--km-moss);
        color: #fbfaf6;
        border-radius: 999px;
        padding: 14px 22px;
        font-size: 17px;
        box-shadow: 0 6px 18px -8px var(--km-moss);
      }

      .km-btn-primary:active { background: var(--km-moss-press); }

      .km-btn-ghost {
        background: transparent;
        color: var(--km-moss);
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 15px;
      }

      .km-btn-chip {
        background: var(--km-card);
        color: var(--km-text);
        border: 1px solid var(--km-stroke);
        border-radius: 999px;
        padding: 9px 14px;
        font-size: 14px;
        font-weight: 500;
      }

      .km-btn-chip[data-on="true"] {
        background: var(--km-moss-bg);
        border-color: var(--km-moss-line);
        color: var(--km-moss);
      }

      .km-card {
        background: var(--km-card);
        border-radius: 18px;
        border: 1px solid var(--km-stroke);
      }

      .km-hairline {
        height: 1px;
        background: var(--km-stroke);
        width: 100%;
      }

      .km-eyebrow {
        text-transform: uppercase;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: var(--km-text-3);
      }

      .km-title-md {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .km-meta {
        font-size: 12px;
        color: var(--km-text-3);
      }

      .km-speaker-dot {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0;
      }

      .km-segment {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        background: var(--km-bg-2);
        border-radius: 10px;
        padding: 3px;
        position: relative;
      }

      .km-segment-thumb {
        position: absolute;
        top: 3px;
        bottom: 3px;
        width: calc((100% - 6px) / 3);
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 0 0 0.5px rgba(0,0,0,0.04);
        transition: transform 220ms cubic-bezier(.4,0,.2,1);
      }

      .km-segment-thumb[data-i="1"] { transform: translateX(100%); }
      .km-segment-thumb[data-i="2"] { transform: translateX(200%); }

      .km-segment button {
        z-index: 1;
        background: transparent;
        border: 0;
        height: 30px;
        font-size: 12px;
        font-weight: 600;
        color: var(--km-text-2);
        cursor: pointer;
        letter-spacing: -0.01em;
      }

      .km-segment button[data-on="true"] { color: var(--km-text); }

      textarea {
        width: 100%;
        border: 0;
        outline: 0;
        resize: none;
        background: transparent;
        color: var(--km-text);
        font-size: 14px;
        line-height: 1.55;
      }

      input {
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--km-text);
        min-width: 0;
      }

      @keyframes km-pulse {
        0%, 100% { opacity: 0.45; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.06); }
      }

      .km-pulse { animation: km-pulse 1.4s ease-in-out infinite; }

      @keyframes km-card-eject {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        35% { transform: translateY(8px) scale(0.97); opacity: 1; }
        100% { transform: translateY(-30px) scale(0.94); opacity: 0; }
      }

      @keyframes km-plane-fly {
        0% { transform: translate(-50%, 0) scale(1) rotate(-15deg); opacity: 0; }
        10% { opacity: 1; }
        100% { transform: translate(80%, -680px) scale(0.55) rotate(28deg); opacity: 0; }
      }

      @keyframes km-trail-draw { to { stroke-dashoffset: 0; } }

      @keyframes km-toast-in {
        0% { transform: translate(-50%, 18px); opacity: 0; }
        20% { opacity: 1; }
        85% { opacity: 1; transform: translate(-50%, 0); }
        100% { transform: translate(-50%, 0); opacity: 0; }
      }

      @keyframes km-sheet-in {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
      }

      @keyframes km-fade-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes km-fade-up {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .share-backdrop {
        position: absolute;
        inset: 0;
        background: #f3f2ed;
        filter: blur(1.5px);
        opacity: 0.72;
        transform: scale(1.02);
      }

      .share-sheet {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 86%;
        border-top-left-radius: 28px;
        border-top-right-radius: 28px;
        background: var(--km-bg);
        box-shadow: 0 -20px 50px rgba(0,0,0,0.15);
        overflow: hidden;
        animation: km-sheet-in 320ms cubic-bezier(.32,.72,.4,1);
      }

      .section {
        padding: 22px 20px 0;
      }

      .section-title {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 12px;
      }

      .section-title span {
        color: var(--km-moss);
      }

      .section-title div {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .bottom-gradient {
        padding: 12px 20px 28px;
        background: linear-gradient(to top, var(--km-bg) 60%, transparent);
      }

      .toast {
        position: absolute;
        left: 50%;
        bottom: 100px;
        transform: translateX(-50%);
        background: rgba(30,32,28,0.92);
        color: #fff;
        padding: 10px 16px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        animation: km-toast-in 2.3s ease forwards;
        z-index: 60;
        white-space: nowrap;
      }

      @media (max-width: 430px) {
        body { display: block; background: var(--km-bg); }
        .device {
          width: 100vw;
          height: 100vh;
          border-radius: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="device">
      <div class="island"></div>
      <div class="status">
        <span>9:41</span>
        <span class="status-icons">
          <svg width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill="currentColor"/><rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill="currentColor"/><rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill="currentColor"/><rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill="currentColor"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="currentColor" stroke-opacity="0.35" fill="none"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/><path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill="currentColor" fill-opacity="0.4"/></svg>
        </span>
      </div>
      <div id="screen" class="screen"></div>
      <div class="home-indicator"><div></div></div>
    </main>

    <script>
      const screen = document.querySelector("#screen");
      const maxInput = 50000;
      const focusChips = [
        { id: "decision", label: "決めごと", hint: "決定事項・合意した内容" },
        { id: "todo", label: "やること", hint: "誰が・いつ・何を" },
        { id: "money", label: "お金", hint: "金額・支払い・見積もり" },
        { id: "schedule", label: "予定", hint: "日付・期限・次回" },
        { id: "concern", label: "懸念点", hint: "不安・リスク・要確認" },
        { id: "feeling", label: "気持ち", hint: "温度感・ニュアンス" }
      ];
      const categoryChips = ["住宅", "仕事", "家庭", "その他"];
      const speakerPalette = [
        { id: "me", name: "自分", initial: "自", hue: 145 },
        { id: "partner", name: "相手", initial: "相", hue: 30 },
        { id: "staff", name: "担当者", initial: "担", hue: 220 },
        { id: "family", name: "家族", initial: "家", hue: 280 }
      ];

      const state = {
        phase: "home",
        transcript: "今日は住宅購入について打ち合わせました。次回までに見積もりと住宅ローンの条件を確認します。金額とスケジュールは家族に共有して、来週もう一度相談します。",
        speakersText: "自分, 担当者",
        selectedSpeakers: ["me", "staff"],
        focus: "decision",
        category: "住宅",
        note: "",
        result: null,
        resultTab: "summary",
        toast: null,
        flying: false,
        archives: [],
        archiveQuery: "",
        archiveFolder: "住宅",
        editingLine: null,
        speakerOverrides: {}
      };

      function icon(name, size = 18) {
        const attrs = `width="${size}" height="${size}" viewBox="0 0 24 24"`;
        const stroke = `fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"`;
        const icons = {
          plus: `<svg ${attrs} ${stroke}><path d="M12 5v14M5 12h14"/></svg>`,
          folder: `<svg ${attrs} ${stroke}><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>`,
          doc: `<svg ${attrs} ${stroke}><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h5"/></svg>`,
          sparkle: `<svg ${attrs} fill="currentColor"><path d="M12 2l1.7 5.3L19 9l-5.3 1.7L12 16l-1.7-5.3L5 9l5.3-1.7L12 2z"/><circle cx="19" cy="18" r="1.5"/><circle cx="5" cy="18" r="1"/></svg>`,
          check: `<svg ${attrs} ${stroke} stroke-width="2.2"><path d="M5 12.5l4.5 4.5L20 6.5"/></svg>`,
          copy: `<svg ${attrs} ${stroke}><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2"/></svg>`,
          plane: `<svg ${attrs} ${stroke}><path d="M21 3 3 11l7 2 2 7 9-17z"/><path d="M10 13l4-4"/></svg>`,
          back: `<svg ${attrs} ${stroke} stroke-width="2"><path d="M15 5l-7 7 7 7M8 12h13"/></svg>`,
          more: `<svg ${attrs} fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>`,
          search: `<svg ${attrs} ${stroke}><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>`,
          x: `<svg ${attrs} ${stroke} stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
          chevron: `<svg ${attrs} ${stroke} stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg>`
        };
        return icons[name] || "";
      }

      function escapeHTML(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function currentSpeakers() {
        const names = state.speakersText.split(",").map((name) => name.trim()).filter(Boolean);
        return (names.length ? names : ["自分", "相手"]).slice(0, 4).map((name, index) => ({
          ...(speakerPalette[index] || speakerPalette[0]),
          id: `s${index}`,
          name,
          initial: name.slice(0, 1)
        }));
      }

      function render() {
        if (state.phase === "home") renderHome();
        if (state.phase === "setup") renderShareSetup();
        if (state.phase === "generating") renderGenerating();
        if (state.phase === "result") renderResult();
        if (state.phase === "archive") renderArchive();
      }

      function renderHome() {
        screen.innerHTML = `
          <div style="padding-top:56px;height:100%;display:flex;flex-direction:column;background:var(--km-bg)">
            <div style="padding:8px 20px 0;display:flex;justify-content:flex-end">
              <div style="font-size:13px;font-weight:600;color:var(--km-text-3)">Koremite.</div>
            </div>
            <div style="padding:44px 24px 0">
              <div class="km-eyebrow" style="color:var(--km-moss)">これみて</div>
              <div style="margin-top:6px;font-size:30px;font-weight:800;letter-spacing:-0.025em;line-height:1.2;text-wrap:balance">
                説明しなくていい、<br/>あとで揉めない。
              </div>
              <div style="margin-top:12px;font-size:14.5px;line-height:1.6;color:var(--km-text-2);text-wrap:pretty;max-width:320px">
                ボイスメモなどの<wbr/>文字起こしを貼るだけ。<br/>
                相手に送るまとめと、あとで確認できる議事録に変わります。
              </div>
            </div>
            <div style="flex:1"></div>
            <div style="padding:0 20px 28px;display:flex;flex-direction:column;gap:12px">
              <button class="km-btn km-btn-primary" data-action="start" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 22px;font-size:17px">
                ${icon("plus", 18)} 文字起こしを貼り付け
              </button>
              <button class="km-btn" data-action="archive" style="width:100%;background:var(--km-card);border:1px solid var(--km-stroke);color:var(--km-text);border-radius:999px;padding:14px 22px;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px">
                ${icon("folder", 18)} アーカイブ
              </button>
              <div class="km-meta" style="text-align:center;margin-top:4px;line-height:1.6">
                実音声やマイクは使いません
              </div>
            </div>
          </div>
        `;
      }

      function renderShareSetup() {
        const len = state.transcript.length;
        const hint = len < 1200 ? "短めの文字起こしです。まとめて整理します。" : len < 8000 ? "共有版と議事録をまとめて作成します。" : "長文のため、段階的に整理します。";
        const speakers = currentSpeakers();
        screen.innerHTML = `
          <div class="share-backdrop">
            <div style="padding:118px 20px 0;font-size:32px;font-weight:700;letter-spacing:-0.02em">文字起こし</div>
            <div style="padding:14px 20px;display:flex;flex-direction:column;gap:10px">
              ${["住宅購入の相談メモ", "商談の文字起こし", "家族会議のメモ"].map((t, i) => `
                <div class="km-card" style="padding:14px 16px;display:flex;align-items:center;gap:12px;opacity:${i === 0 ? 1 : 0.58}">
                  <div style="width:34px;height:34px;border-radius:9px;background:var(--km-moss-bg);color:var(--km-moss);display:grid;place-items:center">${icon("doc", 18)}</div>
                  <div><div style="font-size:15px;font-weight:650">${t}</div><div class="km-meta" style="margin-top:3px">${i === 0 ? "今日 21:14" : "最近"}</div></div>
                </div>`).join("")}
            </div>
          </div>

          <div class="share-sheet">
            <div style="height:100%;display:flex;flex-direction:column;background:var(--km-bg)">
              <div style="padding:18px 20px 0;display:flex;align-items:center;justify-content:space-between">
                <button class="km-btn km-btn-ghost" data-action="home">キャンセル</button>
                <div style="font-size:13px;font-weight:600;color:var(--km-text-3)">Koremite に共有</div>
                <div style="width:74px"></div>
              </div>

              <div class="km-scroll" style="flex:1;padding-bottom:18px">
                <div style="padding:10px 20px 0">
                  <div class="km-card" style="padding:14px">
                    <div style="display:flex;align-items:center;gap:12px">
                      <div style="width:38px;height:38px;border-radius:10px;background:var(--km-moss-bg);color:var(--km-moss);display:flex;align-items:center;justify-content:center">${icon("doc", 19)}</div>
                      <div style="flex:1;min-width:0">
                        <div style="font-size:14px;font-weight:600">文字起こしテキスト</div>
                        <div class="km-meta" style="margin-top:2px"><span id="count">${len}</span>文字 ・ ${escapeHTML(hint)}</div>
                      </div>
                    </div>
                    <div style="margin-top:12px;border:1px solid var(--km-stroke);border-radius:12px;background:var(--km-card-2);padding:10px 12px">
                      <textarea id="transcript" rows="7" placeholder="ボイスメモの文字起こしをここに貼り付け">${escapeHTML(state.transcript)}</textarea>
                    </div>
                  </div>
                </div>

                <div class="section">
                  <div class="section-title"><span class="km-eyebrow">01</span><div>誰が話してる？</div></div>
                  <div class="km-meta" style="margin-bottom:12px;margin-top:-8px">カンマ区切りで編集できます</div>
                  <div style="border:1px solid var(--km-stroke);border-radius:12px;background:var(--km-card);padding:10px 12px;margin-bottom:10px">
                    <input id="speakersText" value="${escapeHTML(state.speakersText)}" placeholder="自分, 相手" style="width:100%;font-size:14px" />
                  </div>
                  <div style="display:flex;gap:10px;flex-wrap:wrap">
                    ${speakers.map((s) => `
                      <button class="km-btn speaker-chip" data-speaker="${s.id}" style="background:var(--km-moss-bg);border:1px solid var(--km-moss-line);color:var(--km-moss);border-radius:999px;padding:6px 12px 6px 6px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600">
                        <span class="km-speaker-dot" style="background:var(--km-moss);color:#fff">${icon("check", 14)}</span>${escapeHTML(s.name)}
                      </button>`).join("")}
                  </div>
                </div>

                <div class="section">
                  <div class="section-title"><span class="km-eyebrow">02</span><div>何を重視する？</div></div>
                  <div class="km-meta" style="margin-bottom:12px;margin-top:-8px">AIがそこに集中します</div>
                  <div style="display:flex;gap:8px;flex-wrap:wrap">
                    ${focusChips.map((c) => `<button class="km-btn km-btn-chip" data-focus="${c.id}" data-on="${state.focus === c.id}">${c.label}</button>`).join("")}
                  </div>
                  <div class="km-meta" style="margin-top:10px;animation:km-fade-up 200ms ease both">↳ ${focusChips.find((c) => c.id === state.focus)?.hint}</div>
                </div>

                <div class="section">
                  <div class="section-title"><span class="km-eyebrow">03</span><div>用途</div></div>
                  <div style="display:flex;gap:8px;flex-wrap:wrap">
                    ${categoryChips.map((c) => `<button class="km-btn km-btn-chip" data-category="${c}" data-on="${state.category === c}">${c}</button>`).join("")}
                  </div>
                </div>

                <div class="section">
                  <div class="section-title"><span class="km-eyebrow">04</span><div>メモ <span style="color:var(--km-text-3);font-weight:500">（任意）</span></div></div>
                  <div class="km-meta" style="margin-bottom:12px;margin-top:-8px">背景やニュアンスを伝えると精度が上がります</div>
                  <div style="background:var(--km-card);border:1px solid var(--km-stroke);border-radius:12px;padding:10px 12px">
                    <textarea id="note" rows="3" maxlength="200" placeholder="例: 確定と推測を分けて。金額は必ず拾って">${escapeHTML(state.note)}</textarea>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;color:var(--km-text-4);font-size:11px">
                      <span id="noteCount">${state.note.length} / 200</span>
                      <button class="km-btn" data-action="clear-note" style="background:transparent;color:var(--km-text-3);padding:0;font-size:11px">クリア</button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="bottom-gradient">
                <button class="km-btn km-btn-primary" data-action="generate" ${!state.transcript.trim() || state.transcript.length > maxInput ? "disabled" : ""} style="width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px">
                  ${icon("sparkle", 16)} Koremite を生成
                </button>
                <div class="km-meta" style="text-align:center;margin-top:10px">貼り付けたテキストだけを送信します</div>
              </div>
            </div>
          </div>
        `;
      }

      function renderGenerating() {
        const steps = ["文字起こしを整理中…", "要点を抽出中…", "共有版を作成中…", "詳細記録を構成中…"];
        screen.innerHTML = `
          <div style="padding-top:56px;height:100%;display:flex;flex-direction:column;background:var(--km-bg)">
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px">
              <div style="position:relative;width:160px;height:160px;display:flex;align-items:center;justify-content:center">
                <div class="km-pulse" style="position:absolute;inset:12px;border-radius:999px;background:radial-gradient(circle,var(--km-moss-bg) 0%,transparent 70%)"></div>
                <div style="position:relative;color:var(--km-moss);transform:rotate(-12deg)">${icon("plane", 64)}</div>
              </div>
              <div class="km-title-md" style="margin-top:18px">文字起こしを整理しています</div>
              <div class="km-meta" style="margin-top:4px">${state.transcript.length}文字 ・ ${state.category} ・ ${focusChips.find((c) => c.id === state.focus)?.label}</div>
              <div id="steps" style="margin-top:28px;width:100%;max-width:280px;display:flex;flex-direction:column;gap:12px">
                ${steps.map((label, i) => `
                  <div class="gen-step" data-step="${i}" style="display:flex;align-items:center;gap:10px;opacity:${i === 0 ? 1 : 0.35};transition:opacity 200ms">
                    <div class="gen-dot" style="width:18px;height:18px;border-radius:999px;background:transparent;border:1.5px solid ${i === 0 ? "var(--km-moss)" : "var(--km-stroke-2)"};display:flex;align-items:center;justify-content:center;color:#fff">
                      ${i === 0 ? '<span class="km-pulse" style="width:6px;height:6px;border-radius:999px;background:var(--km-moss)"></span>' : ""}
                    </div>
                    <div style="font-size:14px;color:var(--km-text)">${label}</div>
                  </div>`).join("")}
              </div>
            </div>
            <div style="padding:20px 24px 36px;text-align:center" class="km-meta">コストを抑えるため、内容量に合わせて整理します</div>
          </div>
        `;
      }

      function renderResult() {
        const result = state.result;
        const tabIndex = { summary: 0, minutes: 1, log: 2 }[state.resultTab] || 0;
        screen.innerHTML = `
          <div style="padding-top:56px;height:100%;position:relative;display:flex;flex-direction:column;background:var(--km-bg);overflow:hidden">
            <div style="padding:8px 16px 0;display:flex;align-items:center;justify-content:space-between">
              <button class="km-btn km-btn-ghost" data-action="setup" style="display:inline-flex;align-items:center;gap:4px;padding:8px 6px">${icon("back", 18)}戻る</button>
              <div style="font-size:13px;font-weight:600;color:var(--km-text-3)">Koremite</div>
              <button class="km-btn km-btn-ghost" data-action="archive" style="color:var(--km-text-2)">${icon("more", 18)}</button>
            </div>
            <div style="padding:6px 20px 14px">
              <div class="km-eyebrow" style="color:var(--km-moss)">${escapeHTML(result.category || state.category)} ・ ${result.costInfo?.inputLength ?? state.transcript.length}文字</div>
              <div class="km-title-md" style="margin-top:4px;text-wrap:pretty">${escapeHTML(result.title || "生成結果")}</div>
            </div>
            <div style="padding:0 20px">
              <div class="km-segment">
                <div class="km-segment-thumb" data-i="${tabIndex}"></div>
                <button data-result-tab="summary" data-on="${state.resultTab === "summary"}">共有用</button>
                <button data-result-tab="minutes" data-on="${state.resultTab === "minutes"}">議事録</button>
                <button data-result-tab="log" data-on="${state.resultTab === "log"}">全量ログ</button>
              </div>
            </div>
            <div class="km-scroll" style="flex:1;padding:16px 20px 110px">
              ${renderResultBody(result)}
            </div>
            <div style="position:absolute;left:0;right:0;bottom:0;padding:14px 20px 28px;background:linear-gradient(to top,var(--km-bg) 65%,transparent)">
              <button class="km-btn km-btn-primary" data-action="copy" style="width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px">
                ${icon(state.resultTab === "summary" ? "plane" : "copy", 17)} ${state.resultTab === "summary" ? "コピーして送る" : "議事録をコピー"}
              </button>
            </div>
            ${state.flying ? renderPaperPlane() : ""}
            ${state.toast ? `<div class="toast">${icon("check", 14)} ${escapeHTML(state.toast)}</div>` : ""}
            ${state.editingLine !== null ? renderSpeakerSheet() : ""}
          </div>
        `;
      }

      function renderResultBody(result) {
        if (state.resultTab === "summary") {
          const s = result.shareSummary;
          return `
            <div style="animation:${state.flying ? "km-card-eject 1.2s cubic-bezier(.5,0,.7,1) forwards" : "km-fade-up 280ms ease"}">
              <div class="km-card" style="padding:18px;position:relative">
                <div style="display:flex;gap:10px;align-items:flex-start">
                  <div style="color:var(--km-moss);margin-top:2px">${icon("sparkle", 16)}</div>
                  <div style="font-size:15px;font-weight:600;line-height:1.55;text-wrap:pretty">${escapeHTML(s.text)}</div>
                </div>
                <div style="height:14px"></div><div class="km-hairline"></div><div style="height:14px"></div>
                ${sectionLabel("要点")}
                ${bulletList([...(s.decisions || []), ...(s.confirmationPoints || [])].slice(0, 4), "該当なし")}
                <div style="height:16px"></div>
                ${sectionLabel("次アクション")}
                ${todoList(s.todos)}
              </div>
              <div class="km-meta" style="text-align:center;margin-top:14px">↑ そのままコピーしてメッセージに貼れます</div>
            </div>
          `;
        }

        if (state.resultTab === "minutes") {
          const m = result.detailedMinutes;
          return `
            <div style="display:flex;flex-direction:column;gap:12px;animation:km-fade-up 280ms ease">
              ${minutesCard("概要", `<div style="font-size:14px;line-height:1.6">${escapeHTML(m.overview)}</div>`)}
              ${minutesCard("論点", bulletList(m.topics))}
              ${minutesCard("決定事項", bulletList(m.decisions))}
              ${minutesCard("未決事項", bulletList(m.openIssues))}
              ${minutesCard("TODO", todoList(m.todos))}
              ${minutesCard("重要な発言", bulletList(m.importantRemarks))}
              ${minutesCard("次回に向けたメモ", bulletList(m.nextMeetingNotes))}
            </div>
          `;
        }

        const entries = result.fullLog || [];
        const speakers = currentSpeakers();
        return `
          <div style="display:flex;flex-direction:column;animation:km-fade-up 280ms ease">
            <div class="km-card" style="padding:14px 16px;margin-bottom:14px">
              <div class="km-eyebrow">全量ログ</div>
              <div style="font-size:15px;font-weight:700;margin-top:4px">${escapeHTML(result.title || "生成結果")}</div>
              <div style="margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px">
                <span style="color:var(--km-text-3)">参加者</span>
                <span style="display:inline-flex;gap:6px;flex-wrap:wrap">${speakers.map((s) => speakerBadge(s)).join("")}</span>
              </div>
            </div>
            ${entries.map((line, i) => transcriptLine(line, i)).join("")}
            ${result.confidenceWarnings?.length ? minutesCard("確認が必要な点", bulletList(result.confidenceWarnings)) : ""}
          </div>
        `;
      }

      function sectionLabel(title) {
        return `<div style="font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--km-text-3)">${title}</div>`;
      }

      function bulletList(items, empty = "該当なし") {
        if (!items || items.length === 0) return `<div class="km-meta" style="margin-top:8px">${empty}</div>`;
        return `<ul style="margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px">${items.map((p) => `
          <li style="display:flex;gap:10px;font-size:14px;line-height:1.5">
            <span style="margin-top:7px;width:4px;height:4px;border-radius:2px;background:var(--km-moss);flex-shrink:0"></span>${escapeHTML(p)}
          </li>`).join("")}</ul>`;
      }

      function todoList(items) {
        if (!items || items.length === 0) return `<div class="km-meta" style="margin-top:8px">該当なし</div>`;
        return `<div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">${items.map((item) => `
          <div style="font-size:14px;line-height:1.5">
            ${escapeHTML(item.task)}
            <div class="km-meta" style="margin-top:2px">${escapeHTML([item.owner, item.due].filter(Boolean).join(" ・ "))}</div>
          </div>`).join("")}</div>`;
      }

      function minutesCard(title, body) {
        return `<div class="km-card" style="padding:14px 16px">${sectionLabel(title)}<div style="margin-top:8px">${body}</div></div>`;
      }

      function speakerBadge(s) {
        return `<span style="display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 3px;border-radius:999px;background:var(--km-bg-2)">
          <span class="km-speaker-dot" style="width:18px;height:18px;font-size:10px;background:oklch(88% 0.025 ${s.hue})">${escapeHTML(s.initial)}</span>${escapeHTML(s.name)}
        </span>`;
      }

      function transcriptLine(line, i) {
        const speakers = currentSpeakers();
        const s = speakers[i % speakers.length] || speakers[0];
        const flagged = i === 0 && (state.result?.confidenceWarnings || []).length > 0;
        return `
          <div style="display:flex;gap:10px;align-items:flex-start;padding-top:${i ? 10 : 0}px;padding-bottom:7px;border-top:${i ? "1px dashed var(--km-stroke)" : "none"}">
            <button class="km-speaker-dot" data-edit-line="${i}" style="background:oklch(88% 0.025 ${s.hue});color:var(--km-text);border:${flagged ? "1.5px dashed var(--km-warn)" : "none"};cursor:pointer;flex-shrink:0">${escapeHTML(s.initial)}</button>
            <div style="flex:1;min-width:0">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
                <span style="font-size:13px;font-weight:700">${escapeHTML(line.speaker || s.name)}</span>
                ${flagged ? `<span style="font-size:10px;font-weight:700;color:var(--km-warn);border:1px solid var(--km-warn);border-radius:4px;padding:1px 5px">要確認</span>` : ""}
              </div>
              <div style="font-size:14px;line-height:1.6;color:var(--km-text)">${escapeHTML(line.text)}</div>
            </div>
          </div>`;
      }

      function renderSpeakerSheet() {
        const line = state.result.fullLog[state.editingLine];
        return `
          <div data-action="close-sheet" style="position:absolute;inset:0;background:rgba(0,0,0,0.35);animation:km-fade-in 200ms ease;z-index:70"></div>
          <div style="position:absolute;left:0;right:0;bottom:0;background:var(--km-bg);border-top-left-radius:22px;border-top-right-radius:22px;padding:10px 20px 28px;animation:km-sheet-in 280ms cubic-bezier(.32,.72,.4,1);z-index:71">
            <div style="width:36px;height:4px;border-radius:2px;background:var(--km-stroke-2);margin:0 auto 10px"></div>
            <div style="font-size:17px;font-weight:700;letter-spacing:-0.02em">話者を修正</div>
            <div class="km-meta" style="margin-top:4px;margin-bottom:16px">「${escapeHTML(line.text.slice(0, 28))}${line.text.length > 28 ? "…" : ""}」</div>
            <div style="display:flex;flex-direction:column;gap:8px">
              ${currentSpeakers().map((s) => `
                <button class="km-btn" data-pick-speaker="${s.name}" style="background:var(--km-card);border:1px solid var(--km-stroke);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:12px;text-align:left">
                  <span class="km-speaker-dot" style="background:oklch(88% 0.025 ${s.hue})">${escapeHTML(s.initial)}</span>
                  <span style="flex:1;font-size:15px;font-weight:600">${escapeHTML(s.name)}</span>
                </button>`).join("")}
            </div>
            <button data-action="close-sheet" class="km-btn km-btn-ghost" style="width:100%;margin-top:10px;padding:12px 14px;background:var(--km-card-2);border-radius:12px;color:var(--km-text-2)">キャンセル</button>
          </div>
        `;
      }

      function renderPaperPlane() {
        return `
          <div style="position:absolute;inset:0;pointer-events:none;z-index:50">
            <svg viewBox="0 0 400 800" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%">
              <path d="M 200 540 Q 260 380, 200 240 T 320 60" fill="none" stroke="var(--km-moss)" stroke-width="1.5" stroke-opacity="0.55" stroke-dasharray="4 6" style="stroke-dashoffset:600;animation:km-trail-draw 1.1s ease forwards"></path>
            </svg>
            <div style="position:absolute;left:50%;top:480px;transform:translate(-50%,0) rotate(-15deg);color:var(--km-moss);animation:km-plane-fly 1.2s cubic-bezier(.5,0,.4,1) forwards">${icon("plane", 42)}</div>
          </div>`;
      }

      function renderArchive() {
        const folders = ["住宅", "仕事", "家庭", "その他"];
        const all = state.archives.map((item) => ({ ...item, folder: item.category || "その他", date: "保存済み" }));
        const fallback = [
          { title: "リフォーム、洗面所の見積もり確認", folder: "住宅", date: "サンプル", shareSummary: { text: "見積もり確認と次回相談のサンプルです。" } },
          { title: "Q2の方針、上長との1on1", folder: "仕事", date: "サンプル", shareSummary: { text: "仕事カテゴリの保存例です。" } }
        ];
        const items = all.length ? all : fallback;
        const filtered = state.archiveQuery ? items.filter((it) => `${it.title} ${it.folder} ${it.shareSummary?.text || ""}`.includes(state.archiveQuery)) : null;
        screen.innerHTML = `
          <div style="padding-top:56px;height:100%;display:flex;flex-direction:column;background:var(--km-bg)">
            <div style="padding:8px 20px 12px;display:flex;align-items:center;justify-content:space-between">
              <button class="km-btn km-btn-ghost" data-action="home" style="display:inline-flex;align-items:center;gap:4px;padding:8px 6px">${icon("back", 18)}戻る</button>
              <div style="font-size:13px;font-weight:600;color:var(--km-text-3)">アーカイブ</div>
              <div style="width:56px"></div>
            </div>
            <div style="padding:0 20px 8px">
              <div style="background:var(--km-bg-2);border-radius:10px;padding:9px 12px;display:flex;align-items:center;gap:8px;color:var(--km-text-3)">
                ${icon("search", 16)}
                <input id="archiveQuery" value="${escapeHTML(state.archiveQuery)}" placeholder="会話を横断検索（金額、5月、見積もり…）" style="flex:1;font-size:14px;font-family:inherit" />
                ${state.archiveQuery ? `<button class="km-btn" data-action="clear-search" style="background:transparent;color:var(--km-text-3);padding:0">${icon("x", 14)}</button>` : ""}
              </div>
            </div>
            <div class="km-scroll" style="flex:1;padding:8px 0 28px">
              ${filtered ? archiveResults(filtered) : archiveFolders(folders, items)}
            </div>
          </div>
        `;
      }

      function archiveResults(items) {
        return `<div style="padding:8px 20px"><div class="km-eyebrow" style="margin-bottom:10px">結果 ${items.length}件</div><div style="display:flex;flex-direction:column;gap:8px">${items.map(archiveRow).join("") || `<div class="km-meta" style="text-align:center;padding:24px">該当なし。</div>`}</div></div>`;
      }

      function archiveFolders(folders, items) {
        return `
          <div style="padding:0 20px 14px">
            <div class="km-eyebrow" style="margin-bottom:10px">自動分類</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
              ${folders.map((f) => {
                const count = items.filter((it) => it.folder === f || it.category === f).length;
                return `<button class="km-card" data-folder="${f}" style="padding:14px;text-align:left;cursor:pointer;background:${state.archiveFolder === f ? "var(--km-moss-bg)" : "var(--km-card)"};border-color:${state.archiveFolder === f ? "var(--km-moss-line)" : "var(--km-stroke)"}">
                  <div style="color:${state.archiveFolder === f ? "var(--km-moss)" : "var(--km-text-2)"}">${icon("folder", 20)}</div>
                  <div style="font-size:15px;font-weight:700;margin-top:8px">${f}</div>
                  <div class="km-meta" style="margin-top:2px">${count}件</div>
                </button>`;
              }).join("")}
            </div>
          </div>
          <div style="padding:8px 20px">
            <div class="km-eyebrow" style="margin-bottom:10px">${state.archiveFolder}</div>
            <div style="display:flex;flex-direction:column;gap:8px">
              ${items.filter((it) => (it.folder || it.category) === state.archiveFolder).map(archiveRow).join("") || `<div class="km-meta" style="text-align:center;padding:20px">まだ保存はありません</div>`}
            </div>
          </div>
        `;
      }

      function archiveRow(item, index) {
        return `<button class="km-card" data-open-archive="${index || 0}" style="padding:12px 14px;display:flex;align-items:center;gap:12px;border-color:${item.current ? "var(--km-moss-line)" : "var(--km-stroke)"};background:${item.current ? "var(--km-moss-bg)" : "var(--km-card)"};text-align:left;width:100%">
          <div style="flex:1;min-width:0">
            <div style="font-size:14.5px;font-weight:600;line-height:1.4;text-wrap:pretty">${escapeHTML(item.title)}</div>
            <div class="km-meta" style="margin-top:4px;display:flex;gap:8px;align-items:center">
              <span>${escapeHTML(item.folder || item.category || "その他")}</span><span>·</span><span>${escapeHTML(item.date || "保存済み")}</span>
            </div>
          </div>
          <div style="color:var(--km-text-4)">${icon("chevron", 14)}</div>
        </button>`;
      }

      function syncInputs() {
        const transcript = document.querySelector("#transcript");
        const speakersText = document.querySelector("#speakersText");
        const note = document.querySelector("#note");
        if (transcript) state.transcript = transcript.value;
        if (speakersText) state.speakersText = speakersText.value;
        if (note) state.note = note.value;
      }

      async function generate() {
        syncInputs();
        state.phase = "generating";
        render();
        let step = 0;
        const stepTimer = setInterval(() => {
          step += 1;
          document.querySelectorAll(".gen-step").forEach((el, i) => {
            el.style.opacity = i <= step ? "1" : "0.35";
            const dot = el.querySelector(".gen-dot");
            if (i < step) {
              dot.style.background = "var(--km-moss)";
              dot.style.borderColor = "var(--km-moss)";
              dot.innerHTML = icon("check", 11);
            } else if (i === step) {
              dot.style.borderColor = "var(--km-moss)";
              dot.innerHTML = '<span class="km-pulse" style="width:6px;height:6px;border-radius:999px;background:var(--km-moss)"></span>';
            }
          });
        }, 650);

        try {
          const payload = {
            transcript: state.transcript,
            category: state.category,
            speakers: currentSpeakers().map((s) => s.name),
            focusPoints: [focusChips.find((c) => c.id === state.focus)?.label].filter(Boolean)
          };
          const response = await fetch("/api/minutes-test", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const json = await response.json();
          if (!response.ok) throw new Error(json.message || "生成できませんでした。");
          state.result = json;
          state.resultTab = "summary";
          state.phase = "result";
        } catch (error) {
          state.phase = "setup";
          state.toast = error.message || "生成できませんでした";
          setTimeout(() => { state.toast = null; render(); }, 1800);
        } finally {
          clearInterval(stepTimer);
          render();
        }
      }

      function copyCurrent() {
        const text = state.resultTab === "summary" ? state.result.shareSummary.text : minutesText(state.result);
        navigator.clipboard?.writeText(text);
        state.flying = state.resultTab === "summary";
        state.toast = "クリップボードにコピーしました";
        render();
        setTimeout(() => { state.flying = false; render(); }, 1300);
        setTimeout(() => { state.toast = null; render(); }, 2300);
      }

      function minutesText(result) {
        const m = result.detailedMinutes;
        return [
          result.title, "", "概要", m.overview, "", "論点",
          ...(m.topics || []).map((x) => `- ${x}`), "", "決定事項",
          ...(m.decisions || []).map((x) => `- ${x}`), "", "未決事項",
          ...(m.openIssues || []).map((x) => `- ${x}`), "", "TODO",
          ...(m.todos || []).map((x) => `- ${x.owner ? `${x.owner}: ` : ""}${x.task}${x.due ? `（${x.due}）` : ""}`)
        ].join("\n");
      }

      screen.addEventListener("input", (event) => {
        if (event.target.id === "transcript") {
          state.transcript = event.target.value;
          const count = document.querySelector("#count");
          if (count) count.textContent = state.transcript.length;
        }
        if (event.target.id === "speakersText") state.speakersText = event.target.value;
        if (event.target.id === "note") {
          state.note = event.target.value;
          const count = document.querySelector("#noteCount");
          if (count) count.textContent = `${state.note.length} / 200`;
        }
        if (event.target.id === "archiveQuery") {
          state.archiveQuery = event.target.value;
          render();
        }
      });

      screen.addEventListener("click", (event) => {
        const target = event.target.closest("[data-action], [data-focus], [data-category], [data-result-tab], [data-folder], [data-edit-line], [data-pick-speaker]");
        if (!target) return;
        const action = target.dataset.action;
        if (action === "start") { state.phase = "setup"; render(); }
        if (action === "home") { state.phase = "home"; render(); }
        if (action === "archive") { state.phase = "archive"; render(); }
        if (action === "setup") { state.phase = "setup"; render(); }
        if (action === "clear-note") { state.note = ""; render(); }
        if (action === "generate") generate();
        if (action === "copy") copyCurrent();
        if (action === "clear-search") { state.archiveQuery = ""; render(); }
        if (action === "close-sheet") { state.editingLine = null; render(); }
        if (target.dataset.focus) { state.focus = target.dataset.focus; render(); }
        if (target.dataset.category) { state.category = target.dataset.category; render(); }
        if (target.dataset.resultTab) { state.resultTab = target.dataset.resultTab; render(); }
        if (target.dataset.folder) { state.archiveFolder = target.dataset.folder; render(); }
        if (target.dataset.editLine) { state.editingLine = Number(target.dataset.editLine); render(); }
        if (target.dataset.pickSpeaker && state.editingLine !== null) {
          state.result.fullLog[state.editingLine].speaker = target.dataset.pickSpeaker;
          state.editingLine = null;
          render();
        }
      });

      render();
    </script>
  </body>
</html>
